name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Bundle
        run: cargo xtask bundle vss --release

      - name: Download pluginval
        shell: bash
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip pluginval.zip -d pluginval

      - name: Validate with pluginval
        shell: bash
        run: |
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --validate target/bundled/VSS.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: VSS-windows
          path: target/bundled/VSS.vst3

      - name: Zip release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd target/bundled
          7z a -tzip VSS-windows.zip VSS.vst3

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/bundled/VSS-windows.zip
