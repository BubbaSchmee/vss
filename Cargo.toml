[package]
name = "vss"
version = "0.1.0"
edition = "2021"
authors = ["VSS Open Source"]
license = "GPL-3.0-or-later"
description = "A tempo-synced vowel step sequencer / formant filter VST3 plugin"
repository = "https://github.com/BubbaSchmee/vss"
homepage = "https://github.com/BubbaSchmee/vss"

[workspace]
resolver = "2"
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
rr-ui = { git = "https://github.com/BubbaSchmee/riddim-rack.git", rev = "e6511ba" }
rr-bus = { git = "https://github.com/BubbaSchmee/riddim-rack.git", rev = "e6511ba" }

[dev-dependencies]
# Offscreen editor preview (examples/editor_preview.rs); same pins as the rr-ui preview.
eframe = "=0.31.1"
png = "0.17"

[profile.release]
lto = "thin"
strip = "symbols"
